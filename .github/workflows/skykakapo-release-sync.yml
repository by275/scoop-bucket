name: SkyKakapo Release Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: skykakapo-release-sync
  cancel-in-progress: false

jobs:
  sync-release:
    name: Append new SkyKakapo builds to release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Sync missing release assets
        env:
          RELEASE_TAG: skykakapo-tete009
          RELEASE_TITLE: SkyKakapo (tete009 build)
          ASSET_PATTERN: (?i)^skykakapo-.*\.7z$
          RCLONE_CONFIG: ${{ github.workspace }}/skykakapo/rclone.conf
          RCLONE_CONFIG_PASS: ${{ secrets.RCLONE_CONFIG_PASS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Validate rclone config
          test -n "$RCLONE_CONFIG_PASS"
          test -f "$RCLONE_CONFIG"
          rclone config encryption check --config "$RCLONE_CONFIG"

          # Run sync release
          ./skykakapo/sync-release.unformatted.sh
